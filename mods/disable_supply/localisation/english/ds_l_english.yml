l_english:
 ds_decisions: "Disable Supply (experimental)"
 ds_supply_on: "Supply: skip hourly recalculation"
 ds_supply_off: "Supply: restore hourly recalculation"
 DsSupplyDesc: "Toggle CSupplySystem::UpdateSupply. While skipped, the supply network is never recalculated (performance experiment)."
 ds_trade_on: "Trade: route updates once per day"
 ds_trade_off: "Trade: restore hourly route updates"
 DsTradeDesc: "Trade route updates run every game hour by default; toggled, they run once per day instead."
 ds_pin_on: "Units: keep all divisions in supply"
 ds_pin_off: "Units: stop pinning division supply"
 DsPinDesc: "Pin every active country's division effective-supply ratio to 100%, zeroing all out-of-supply penalties."
